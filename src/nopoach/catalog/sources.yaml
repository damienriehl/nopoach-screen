    occupation_prefixes: ["11", "13", "15", "17", "19", "23", "27", "29"]
    allowed_use: leads
    restriction: ""
    notes: Obtain licensed aggregate access directly from LinkedIn; confirm product and program access terms, and do not collect profiles.
    last_checked: 2026-10-13
    source_link: https://business.linkedin.com/talent-solutions/talent-insights

