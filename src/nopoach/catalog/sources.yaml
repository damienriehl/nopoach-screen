# Maintainer-owned seed snapshot; no prices or terms were live-verified.
version: 1
sources:
  - id: state-ui-wage-records
    name: State unemployment-insurance wage records
    provenance_class: government_or_administrative_records
    cost: Usually staff time plus a data-sharing agreement
    price_verified: false
    data_kind: person_level_histories
    what_it_adds: Quarterly person-employer wage histories and covered-workforce counts, including workers poorly represented in professional profiles.
    occupations_covered_well: Broad UI-covered employment, including production and service workers; occupation codes generally require an agency-supplied crosswalk.
    occupation_prefixes: []
    allowed_use: leads
    restriction: ""
    notes: Request from the state workforce agency under 20 CFR 603; whether an AG is an eligible recipient depends on state law and the data-sharing agreement.
    last_checked: 2026-10-13
    source_link: https://www.ecfr.gov/current/title-20/chapter-V/part-603

  - id: census-lehd
    name: Census LEHD restricted microdata
    provenance_class: government_or_administrative_records
    cost: About $15,000-20,000 per project per year
    price_verified: false
    data_kind: person_level_histories
    what_it_adds: Restricted longitudinal person-employer records for method validation only.
    occupations_covered_well: Broad UI-covered employment; occupation-specific coverage depends on approved research inputs.
    occupation_prefixes: []
    allowed_use: method_validation_only
    restriction: Title 13 bars any output that identifies an employer; never use or recommend this source for enforcement leads.
    notes: Access requires an approved project through a Federal Statistical Research Data Center; the price estimate is unverified.
    last_checked: 2026-10-13
    source_link: https://www.census.gov/about/adrm/fsrdc.html

