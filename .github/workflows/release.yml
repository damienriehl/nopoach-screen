name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Scan repository history (fails closed without secret)
        shell: bash
        env:
          NOPOACH_DENYLIST: ${{ secrets.NOPOACH_DENYLIST }}
        run: |
          export NOPOACH_DENYLIST_PATH="$RUNNER_TEMP/nopoach-denylist.txt"
          trap 'rm -f "$NOPOACH_DENYLIST_PATH"' EXIT
          printf '%s' "$NOPOACH_DENYLIST" > "$NOPOACH_DENYLIST_PATH"
          unset NOPOACH_DENYLIST
          python packaging/scan_repository.py --history
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install dependencies
        run: |
          uv sync --locked --group dev --group build
      - name: Verify source
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy src
          uv run --no-sync pytest
      - name: Build zip, CycloneDX SBOM, hash manifest and IT note
        run: uv run --no-sync python packaging/build.py --output release
      - name: Smoke executable and verify release hashes
        shell: pwsh
        run: |
          $env:NOPOACH_EXECUTABLE = (Resolve-Path release/nopoach-screen/nopoach-screen.exe).Path
          uv run --no-sync pytest -m live tests/packaging/test_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content release/SHA256SUMS.txt | ForEach-Object {
            $parts = $_ -split '  ', 2
            $actual = (Get-FileHash (Join-Path release $parts[1]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) { throw 'Release hash mismatch' }
          }
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            release/nopoach-screen.zip
            release/SHA256SUMS.txt
            release/bom.cdx.json
            release/IT-REVIEW.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nopoach-screen-windows
          if-no-files-found: error
          path: |
            release/nopoach-screen.zip
            release/SHA256SUMS.txt
            release/bom.cdx.json
            release/IT-REVIEW.md
      - name: Publish tag release
        shell: pwsh
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$env:GITHUB_REF_NAME" --verify-tag --generate-notes
          release/nopoach-screen.zip release/SHA256SUMS.txt
          release/bom.cdx.json release/IT-REVIEW.md
